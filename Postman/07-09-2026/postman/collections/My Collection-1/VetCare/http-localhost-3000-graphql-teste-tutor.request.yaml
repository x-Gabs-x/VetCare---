$kind: http-request
name: http://localhost:3000/graphql-teste-tutor
url: http://localhost:3000/graphql
method: POST
body:
  type: json
  content: "{\r

    \  \"query\": \"{ agendamentos { id data horario status } }\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "const resposta = pm.response.json();\r

      \r

      if (!resposta.token) {\r

      \    throw new Error('A resposta não contém token');\r

      }\r

      \r

      pm.environment.set('token', resposta.token);\r

      \r

      console.log('Token salvo:', resposta.token);"
    language: text/javascript
order: 12000
