$kind: http-request
url: http://localhost:3000/auth/login
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"lucas@vetcare.com\",\r

    \  \"senha\": \"123456\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "const resposta = pm.response.json();\r

      \ \r

      if (!resposta.token) {\r

      \    throw new Error('A resposta não contém token');\r

      }\r

      \ \r

      pm.environment.set('token', resposta.token);\r

      \ \r

      console.log('Token salvo:', resposta.token);"
    language: text/javascript
order: 1000
